# #################################################
#   ZSH Configuration
# #################################################

# Export $PATH
export PATH=$HOME/bin:$HOME/.local/bin:/usr/local/bin:$PATH
# Path to your Oh My Zsh installation.
export ZSH="$HOME/.oh-my-zsh"
# ZSH Theme
ZSH_THEME="powerlevel10k/powerlevel10k"
[[ -f ~/.p10k.zsh ]] && source ~/.p10k.zsh
# Case-sensitive completion
CASE_SENSITIVE="true"
# Hyphen-insensitive completion (case-sensitive completion must be off) 
HYPHEN_INSENSITIVE="false"
# Auto-update behavior
zstyle ':omz:update' mode auto
# Auto-update frequency (in days)
zstyle ':omz:update' frequency 13
# Enable if pasting URLs and other text is messed up
DISABLE_MAGIC_FUNCTIONS="false"
# Disable colors in ls
DISABLE_LS_COLORS="false"
# Disable auto-setting terminal title
DISABLE_AUTO_TITLE="false"
# Enable command auto-correction
ENABLE_CORRECTION="true"
# Display red dots whilst waiting for completion
# You can also set it to another string to have that shown instead of the default red dots.
# e.g. COMPLETION_WAITING_DOTS="%F{yellow}waiting...%f"
COMPLETION_WAITING_DOTS="true"
# Disable marking untracked files under VCS as dirty
DISABLE_UNTRACKED_FILES_DIRTY="false"
# Change the command execution time stamp shown in the history command output
HIST_STAMPS="mm/dd/yyyy"
# Export NVM
export NVM_DIR="$HOME/.nvm"
[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
[ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

# #################################################
#   ENVIRONMENT VARIABLES
# #################################################

export PATH="$PATH:/opt/nvim-linux-x86_64/bin"
if command -v zoxide &>/dev/null; then
    eval "$(zoxide init zsh)"
else
    echo "zoxide is not installed."
fi

# #################################################
#  PLUGINS
# #################################################

plugins=(
    git
    zsh-syntax-highlighting
    zsh-autosuggestions
)

# #################################################
#  ALIASES
# ################################################

# Home directory shortcut
alias home='cd ~/'
# Python alias
alias py=python3
alias python=py
# Neovim alias
alias vi=nvim vim=vi v=vi
# Eza alias (fallback to ls if not installed)
if command -v eza &>/dev/null; then
    alias ls='eza --icons'
    alias ll='eza -l --icons'
    alias la='eza -la --icons'
else
    echo "eza is not installed."
    alias ll='ls -l'
    alias la='ls -la'
fi
# Cd function for z + ls (works with or without zoxide)
cd() {
    if command -v zoxide &>/dev/null; then
        z "$@" && ls
    else
        builtin cd "$@" && ls
    fi
}
# Mkdir function to automatically cd into new dir
mkcdir ()
{
    mkdir -p -- "$1" &&
       cd -P -- "$1"
}

# #################################################
#  INIT 
# #################################################

# Tmux - auto-attach to "main" session or create if it doesn't exist
if [ -z "$TMUX" ]; then
  tmux has-session -t main 2>/dev/null
  if [ $? != 0 ]; then
    # Session doesn't exist, create it (detached so multiple terminals don't share same view)
    tmux new-session -d -s main
    tmux attach-session -t main
  else
    # Session exists, attach to it
    tmux attach-session -t main
  fi
fi
# Print message and boot animation (if connected using SSH)
if [ -n "$SSH_CONNECTION" ]; then
    echo "You are connected via SSH."
    ~/.config/zshrc/boot-anim.sh
fi

# #################################################
# LEAVE AT END OF FILE 
# #################################################

source $ZSH/oh-my-zsh.sh
